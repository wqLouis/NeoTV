name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ###########################################################################
  # Linux build (x86_64)
  ###########################################################################
  build-linux:
    name: "Linux (x86_64)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install

      - name: Build frontend
        run: bun run build

      - name: Build Tauri app (release)
        run: |
          cd src-tauri
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare artifacts
        run: |
          mkdir -p dist-linux
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/neotv dist-linux/neotv
          chmod +x dist-linux/neotv

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: neotv-linux-x86_64
          path: dist-linux/neotv
          compression-level: 0
          if-no-files-found: error

  ###########################################################################
  # Summary
  ###########################################################################
  summary:
    name: "Build Summary"
    needs: [build-linux]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Collect results
        run: |
          echo "## ✅ Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux (x86_64) | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
