name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_windows:
        description: "Sign Windows executables"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  APP_NAME: NeoTV
  APP_IDENTIFIER: com.neotv.app

jobs:
  ###########################################################################
  # Linux build (x86_64)
  ###########################################################################
  build-linux:
    name: "Linux (x86_64)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (release)
        run: |
          cd src-tauri
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare artifacts
        run: |
          mkdir -p dist-linux
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/app dist-linux/neotv
          chmod +x dist-linux/neotv

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: neotv-linux-x86_64
          path: dist-linux/neotv
          compression-level: 0
          if-no-files-found: error

  ###########################################################################
  # Windows build (cross-compiled from Ubuntu) + Authenticode signing
  ###########################################################################
  build-windows:
    name: "Windows (x86_64)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW cross toolchain & osslsigncode
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            libssl-dev \
            osslsigncode

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app (release — Windows cross-compile)
        run: |
          cd src-tauri
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Prepare artifacts
        run: |
          mkdir -p dist-windows
          cp src-tauri/target/x86_64-pc-windows-gnu/release/app.exe dist-windows/neotv.exe

      # ── Windows Authenticode Signing (via osslsigncode on Linux) ─────
      #
      # Required setup:
      #
      # 1. Create a code signing certificate (PFX) and add to repo secrets:
      #    Name: WIN_CERT_BASE64
      #    Value: base64-encoded .pfx file content
      #
      # 2. Add the certificate password as a secret:
      #    Name: WIN_CERT_PASS
      #
      # 3. (Optional) Set repo variable WIN_SIGN_ENABLED=true to auto-sign
      #    on push/PR. Otherwise signing only runs via workflow_dispatch.
      #
      # To generate a self-signed cert for testing (NOT for production):
      #   openssl req -x509 -newkey rsa:4096 -keyout key.pem \
      #     -out cert.pem -days 365 -nodes \
      #     -subj "/CN=NeoTV Development"
      #   openssl pkcs12 -export -out cert.pfx -inkey key.pem -in cert.pem
      #   base64 -w0 cert.pfx
      #
      - name: Sign Windows executable
        if: >
          vars.WIN_SIGN_ENABLED == 'true' || github.event.inputs.sign_windows == 'true'
        env:
          WIN_CERT_BASE64: ${{ secrets.WIN_CERT_BASE64 }}
          WIN_CERT_PASS: ${{ secrets.WIN_CERT_PASS }}
        run: |
          # Check if certificates are available
          if [ -z "$WIN_CERT_BASE64" ] || [ -z "$WIN_CERT_PASS" ]; then
            echo "⚠️ Skipping signing: certificates not configured"
            exit 0
          fi

          # Decode certificate
          echo "$WIN_CERT_BASE64" | base64 -d > /tmp/signing_cert.pfx

          # Sign with osslsigncode (PKCS#12, SHA-256, RFC 3161 timestamp)
          osslsigncode sign \
            -pkcs12 /tmp/signing_cert.pfx \
            -pass "$WIN_CERT_PASS" \
            -h sha256 \
            -t http://timestamp.digicert.com \
            -in dist-windows/neotv.exe \
            -out dist-windows/neotv-signed.exe

          # Replace original with signed
          mv dist-windows/neotv-signed.exe dist-windows/neotv.exe

          # Verify
          osslsigncode verify -in dist-windows/neotv.exe

          echo "✅ Windows executable signed successfully"

          rm -f /tmp/signing_cert.pfx

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: neotv-windows-x86_64
          path: dist-windows/neotv.exe
          compression-level: 0
          if-no-files-found: error

  ###########################################################################
  # Summary
  ###########################################################################
  summary:
    name: "Build Summary"
    needs: [build-linux, build-windows]
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Collect results
        run: |
          echo "## ✅ Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux (x86_64) | ${{ needs.build-linux.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows (x86_64) | ${{ needs.build-windows.result }} |" >> $GITHUB_STEP_SUMMARY
